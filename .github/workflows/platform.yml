name: DARPy platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen --all-extras python -c "import numpy, numba, cv2, PIL, pygame, matplotlib"
      - run: uv run --frozen --all-extras pytest
      - run: uv run --frozen --all-extras ruff check src/darpy tests
      - run: uv run --frozen --all-extras pyright
      - run: uv build --python 3.14
