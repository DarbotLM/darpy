[project]
name = "darpy"
version = "0.1.0"
description = "DarbotLabs platform for distributed architecture reasoning and planning"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "DarbotLabs" }]
dependencies = []

[project.optional-dependencies]
coverage = ["numpy>=2.3.5", "numba>=0.62", "opencv-python-headless>=4.12", "Pillow>=12.0"]
visualization = ["numpy>=2.3.5", "numba>=0.62", "opencv-python-headless>=4.12", "Pillow>=12.0", "pygame>=2.6"]

[project.scripts]
darpy = "darpy.cli:main"

[project.urls]
Repository = "https://github.com/DarbotLM/darpy"
Issues = "https://github.com/DarbotLM/darpy/issues"
SDK = "https://github.com/DarbotLM/darpy-sdk"

[dependency-groups]
dev = ["pytest>=8.4", "anyio>=4.10", "ruff>=0.12", "pyright>=1.1.405", "coverage>=7.10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darpy"]

[tool.hatch.build.targets.wheel.force-include]
"darp.py" = "darp.py"
"kruskal.py" = "kruskal.py"
"Edges.py" = "Edges.py"
"CalculateTrajectories.py" = "CalculateTrajectories.py"
"multiRobotPathPlanner.py" = "multiRobotPathPlanner.py"
"Visualization.py" = "Visualization.py"
"turns.py" = "turns.py"
"NOTICE.md" = "darpy/NOTICE.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
include = ["src/darpy/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src/darpy"]
venvPath = "."
venv = ".venv"
